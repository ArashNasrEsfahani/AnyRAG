      unit_fa: میلیون تراکنش
      definition:
        fa: "تراکنش‌های موفق (پرداخت برگشت‌نخورده) در سال"
        en: "successful (non-refunded) transactions in the year"
      doc: C.cafebazaar_annual-report_1398
      fa: ["24 میلیون تراکنش", "سال 98"]
      exclude: [p3_b2]          # the report's introduction also states it, but that unit is test gold (T-C-cafebazaar-1397-04)
    - period: "1399"
      value: 27.1
      unit: million transactions
      unit_fa: میلیون تراکنش
      definition:
        fa: "تراکنش‌های موفق در سال"
        en: "successful transactions in the year"
      doc: C.cafebazaar_annual-report_1399
      fa: ["27.1 میلیون تراکنش"]
  reconciliation:
    restatements:
      - period: "1397"
        value: 16
        unit: million transactions
        doc: C.cafebazaar_annual-report_1398
        fa: ["16"]
        only: [p9_b5]
        note: "The 1398 report's yearly chart (24, 16, 15, 13, 10 for 1398 back to 1394) and its 50% growth give 16 million for 1397."

- id: C-TL-cafebazaar-02
  corpus: C
  type: timeline
  answer_type: series
  doc_scope: [C.cafebazaar_annual-report_1397, C.cafebazaar_annual-report_1398, C.cafebazaar_annual-report_1399, C.cafebazaar_annual-report_1401]
  question:
    fa: "گزارش‌های سالانهٔ کافه‌بازار از 1397 تا 1401 شمار برنامه‌ها و بازی‌های بازار را چند گزارش کرده‌اند و این عدد چه تغییری کرده است؟"
    en: "What number of apps and games on Bazaar do Cafe Bazaar's annual reports from 1397 to 1401 give, and how has that number changed?"
  answer:
    fa: "1397: 163 هزار؛ 1398: 127 هزار؛ 1399: 161 هزار برنامه و بازی فعال. برای 1401 گزارش فقط 18 هزار و 800 برنامه و بازی متولد ایران در همان سال را می‌دهد؛ این تعریف دیگری است و با ارقام قبلی قابل مقایسه نیست."
    en: "1397: 163 thousand; 1398: 127 thousand; 1399: 161 thousand active apps and games. For 1401 the report only gives 18,800 apps and games born in Iran that year; that is a different definition and is not comparable with the earlier figures."
  comparable: false
  series_notes:
    fa: "1397 تا 1399 موجودی برنامه‌ها و بازی‌های در دسترس یا فعال بازار در پایان سال را می‌شمارند (نمودار گزارش 1398: 163 هزار در 1397 و 127 هزار در 1398، یعنی 22 درصد کاهش). گزارش 1401 موجودی را نمی‌دهد و فقط «تعداد برنامه و بازی متولد ایران در سال 1401» یعنی 18 هزار و 800 را می‌آورد، که شمار برنامه‌های تازهٔ همان سال است؛ همان گزارش می‌گوید 33 هزار برنامه و بازی حذف یا تعلیق شد. پس افت به 18.8 هزار روند نیست."
    en: "1397 to 1399 count the stock of apps and games available or active on Bazaar at year end (the 1398 report's chart: 163 thousand in 1397 and 127 thousand in 1398, a 22% fall). The 1401 report gives no stock; it only reports 'apps and games born in Iran in 1401', 18,800, i.e. the year's new apps; the same report says 33 thousand apps and games were removed or suspended. The drop to 18.8 thousand is therefore not a trend."
