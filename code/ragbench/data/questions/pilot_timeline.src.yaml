- id: C-TL-tapsell-01
  corpus: C
  type: timeline
  answer_type: series
  doc_scope: [C.tapsell_annual-report_1398, C.tapsell_annual-report_1399, C.tapsell_annual-report_1401]
  question:
    fa: "شبکهٔ تبلیغاتی تپسل در گزارش‌های سالانهٔ 1398، 1399 و 1401 خود برای هر ماه چند کاربر اعلام کرده و این رقم چه تغییری کرده است؟"
    en: "How many users per month did the Tapsell ad network claim in its 1398, 1399 and 1401 annual reports, and how did the figure change?"
  answer:
    fa: "1398: بیش از 40 میلیون؛ 1399: بیش از 45 میلیون کاربر یکتای ماهانه؛ 1401: 72 میلیون کاربر فعال ماهانه. ارقام 1398 و 1399 مربوط به تبلیغات درون‌برنامه‌ای است، اما گزارش 1401 وب‌سایت‌ها را هم در بر می‌گیرد، پس رقم 1401 با دو رقم قبلی مستقیما قابل مقایسه نیست."
    en: "1398: over 40 million; 1399: over 45 million unique monthly users; 1401: 72 million monthly active users. The 1398 and 1399 figures describe in-app advertising, but the 1401 report also covers websites, so the 1401 figure is not directly comparable with the two earlier ones."
  comparable: false
  series_notes:
    fa: "گزارش‌های 1398 و 1399 خود را آمار «تبلیغات درون‌برنامه‌ای» تپسل (و تبلیغات جستجوی بازار) معرفی می‌کنند و از «کاربران منحصربه‌فرد ماهانه» می‌گویند. گزارش 1401 شبکه‌ای از وب‌سایت‌ها و اپلیکیشن‌ها را توصیف می‌کند (تفکیک ترافیک وب، اپ و مرورگر) و «کاربر فعال ماهانه» را بدون قید یکتا می‌آورد. جهش به 72 میلیون تا حدی از گسترش دامنهٔ شبکه است."
    en: "The 1398 and 1399 reports present themselves as statistics of Tapsell's in-app advertising (plus Bazaar search ads) and speak of 'unique monthly users'. The 1401 report describes a network of websites and apps (traffic split into web, app and browser) and gives 'monthly active users' without 'unique'. The jump to 72 million partly reflects the wider network."
  comparability_cues:
    fa: ["وب سایت", "درون برنامه ای", "دامنه شبکه"]
    en: ["website", "in-app", "web traffic", "wider network"]
  memorisable: false
  series:
