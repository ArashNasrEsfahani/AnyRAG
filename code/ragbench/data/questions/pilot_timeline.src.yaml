      definition:
        fa: "بیش از 45 میلیون کاربر منحصربه‌فرد ماهانه در شبکهٔ تبلیغات درون‌برنامه‌ای"
        en: "over 45 million unique monthly users of the in-app ad network"
      doc: C.tapsell_annual-report_1399
