- id: C-TL-tipax-01
  corpus: C
  type: timeline
  answer_type: series
  doc_scope: [C.tipax_annual-report_1400, C.tipax_annual-report_1401, C.tipax_annual-report_1403]
  question:
    fa: "بنا بر گزارش‌های سالانهٔ تیپاکس، از سال 1399 تا 1403 در هر سالی که گزارش‌ها پوشش می‌دهند چند مشتری با تیپاکس مرسوله فرستادند و این شمار چگونه تغییر کرد؟"
    en: "According to Tipax's annual reports, how many customers sent parcels with Tipax in each year the reports cover from 1399 to 1403, and how did that number change?"
  answer:
    fa: "1399: 1،530،000؛ 1401: 2,502,679؛ 1403: 2،788،550 مشتری فرستنده. گزارشی که نامش 1400 است عملکرد 1399 را شرح می‌دهد. گزارش‌های بعدی برای 1400 رقم 2,047,858 و برای 1402 رقم 2،681،240 را هم می‌دهند."
    en: "1399: 1,530,000; 1401: 2,502,679; 1403: 2,788,550 sending customers. The report named 1400 describes 1399. Later reports also give 2,047,858 for 1400 and 2,681,240 for 1402."
  comparable: true
  series_notes:
    fa: "گزارش 1400 تیپاکس عملکرد سال 1399 را مرور می‌کند، پس رقم آن برای 1399 است. نمودار گزارش 1401 فرستنده‌های 1399 را 1,530,092 (دقیق‌تر از 1،530،000 گرد‌شده) و 1400 را 2,047,858 نشان می‌دهد؛ گزارش 1403 رقم 1402 را 2،681،240 می‌دهد. دام کنار: «تعداد کل مشتریان» 10,447,186 در گزارش 1401 جمع سادهٔ فرستنده و گیرنده است، اما 5.2 میلیون گزارش 1400 مشتریانی را که هم فرستنده و هم گیرنده بودند یک بار شمرده است."
    en: "Tipax's 1400 report reviews 1399, so its figure belongs to 1399. The 1401 report's chart shows 1,530,092 senders for 1399 (more precise than the rounded 1,530,000) and 2,047,858 for 1400; the 1403 report gives 2,681,240 for 1402. A side trap: the 1401 report's 'total customers' 10,447,186 simply adds senders and receivers, whereas the 1400 report's 5.2 million counts customers who both sent and received once."
  memorisable: false
  notes: "Numbers use the Arabic comma as a thousands separator (1،530،000)."
  series:
    - period: "1399"
      value: 1530000
      unit: customers
      unit_fa: مشتری
      definition:
        fa: "مشتریانی که در سال با تیپاکس بسته‌ای ارسال کرده‌اند"
