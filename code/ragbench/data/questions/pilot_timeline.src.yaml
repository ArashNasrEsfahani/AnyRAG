- id: C-TL-cafebazaar-01
  corpus: C
  type: timeline
  answer_type: series
  doc_scope: [C.cafebazaar_annual-report_1397, C.cafebazaar_annual-report_1398, C.cafebazaar_annual-report_1399]
  question:
    fa: "کافه‌بازار در گزارش‌های سالانه‌اش شمار پرداخت‌های موفق کاربران (خرید برنامه، اشتراک و خرید درون‌برنامه‌ای) را برای هر یک از سال‌های 1397 تا 1399 چند اعلام کرده است؟"
    en: "How many successful user payments (app purchases, subscriptions and in-app purchases) did Cafe Bazaar report in its annual reports for each year from 1397 to 1399?"
  answer:
    fa: "1397: 15 میلیون؛ 1398: 24 میلیون؛ 1399: 27.1 میلیون تراکنش موفق. نمودار گزارش 1398 رقم 1397 را 16 میلیون نشان می‌دهد (رشد 50 درصدی تا 24 میلیون)، ولی رقم خود گزارش 1397 یعنی 15 میلیون ملاک است."
    en: "1397: 15 million; 1398: 24 million; 1399: 27.1 million successful transactions. The 1398 report's chart shows 16 million for 1397 (50% growth to 24 million), but the 1397 report's own figure, 15 million, is the gold value."
  comparable: true
  series_notes:
    fa: "تراکنش موفق در هر سه گزارش پرداختی است که برگشت نخورده؛ پرداخت کالاهای غیردیجیتال (مثل تاکسی اینترنتی) شمرده نمی‌شود. بازنویسی: گزارش 1397 می‌گوید در آن سال 15 میلیون تراکنش موفق انجام شد، اما نمودار گزارش 1398 برای 1397 عدد 16 را می‌گذارد و رشد 1398 را 50 درصد می‌داند؛ سال‌های پیش از آن هم در دو نمودار اندکی متفاوت‌اند (1396: 14.5 در برابر 15). گزارش 1399 رشد 13 درصدی را نسبت به 1398 می‌دهد که با 24 میلیون سازگار است."
    en: "In all three reports a successful transaction is a payment that was not refunded; payments for non-digital goods (such as online taxis) are not counted. Restatement: the 1397 report says 15 million successful transactions took place that year, but the 1398 report's chart puts 1397 at 16 and calls 1398's growth 50%; earlier years also differ slightly between the two charts (1396: 14.5 against 15). The 1399 report gives 13% growth over 1398, consistent with 24 million."
  memorisable: false
  series:
    - period: "1397"
      value: 15
      unit: million transactions
      unit_fa: میلیون تراکنش
      definition:
        fa: "پرداخت‌های موفق برای خرید برنامه، اشتراک و پرداخت درون‌برنامه‌ای در سال"
