      value: 40
      unit: million users
      unit_fa: میلیون کاربر
      definition:
        fa: "بیش از 40 میلیون کاربر منحصربه‌فرد فعال ماهانه در شبکهٔ تبلیغات درون‌برنامه‌ای"
