  answer:
    fa: "1398: 23.17 درصد؛ 1399: 20 درصد؛ 1400: 24 درصد. گزارش 1400 نرخ سال 1399 را 18 درصد نوشته است، اما طبق قاعده رقم خود گزارش 1399 یعنی 20 درصد ملاک است."
    en: "1398: 23.17%; 1399: 20%; 1400: 24%. The 1400 report puts the 1399 rate at 18%, but the rule takes the 1399 report's own figure, 20%."
  comparable: true
  series_notes:
    fa: "هر سه رقم سهم بررسی‌های منجر به رد است و آگهی‌های تازه و ویرایش‌شده را با هم می‌شمارد. بازنویسی: گزارش 1400 نرخ رد 1399 را 18 درصد می‌گوید، در حالی که گزارش 1399 همان سال را 20 درصد اعلام کرده است. گزارش 1399 همچنین می‌گوید 185 میلیون آگهی ثبت، 129 میلیون منتشر و 56 میلیون رد شد (حدود 30 درصد آگهی‌های ثبت‌شده)؛ این نسبت دیگری است، چون مخرج آن آگهی‌های ثبت‌شده است نه بررسی‌ها."
    en: "All three figures are the share of reviews that ended in rejection, counting new and edited ads together. Restatement: the 1400 report says the 1399 rejection rate was 18%, while the 1399 report gave 20% for that year. The 1399 report also says 185 million ads were registered, 129 million published and 56 million rejected (about 30% of registered ads); that is a different ratio, with registered ads rather than reviews as the base."
  memorisable: false
  notes: "Dev question C-divar-01 asks the 1400 rate alone. The 1398 and 1399 values are detached numbers (%23/17, 20) with their labels in neighbouring units."
