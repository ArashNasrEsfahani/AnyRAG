# DEV timeline questions: the human-written source of pilot_timeline.jsonl (file name starts with "pilot", so
# ragbench.run stamps split=dev).
#
# Build (links quotes to unit ids, writes pilot_timeline.jsonl), then validate:
#   .venv/Scripts/python.exe -m ragbench.tools.questions build --src ragbench/data/questions/pilot_timeline.src.yaml --out ragbench/data/questions/pilot_timeline.jsonl
#   .venv/Scripts/python.exe -m ragbench.tools.questions validate --path ragbench/data/questions/pilot_timeline.jsonl --strict
#
# Schema: ragbench/eval/timeline.py (fields, the reconciliation rule, scoring). YAML keys: ragbench/tools/timeline_questions.py.
# Every value was copied from corpus C unit text (ragbench.corpus.registry.load_set("C")), not from a model.
#
# Reconciliation rule: the report OF a period gives the gold value. A later report's different number for that
# period is a restatement (not gold); a period without its own report in the corpus is supplementary (optional).
#
# Series chosen from reports the test set does not use for series: Divar 1397-1400, Cafe Bazaar 1397-1401, Tipax
# 1400/1401/1403, Tapsell 1398/1399/1401, Karnameh 1401/1402. No unit below is gold in test_*.jsonl (checked after
# build; Cafe Bazaar 1398's introduction p3_b2 is excluded for that reason). Divar 1400 p51_b3 is shared with the
# dev question C-divar-01 only.
# Tapsell's 1397 file is a download landing page without figures, so Tapsell starts at 1398.

questions:

