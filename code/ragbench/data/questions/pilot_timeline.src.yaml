        fa: "تعداد مشتری فرستنده در سال (بر پایهٔ شماره‌های یکتا)"
        en: "number of sending customers in the year (by unique numbers)"
      doc: C.tipax_annual-report_1403
      fa: ["2،788،550", "فرستنده"]
