  question:
    fa: "طبق گزارش‌های سالانهٔ دیوار، در هر یک از سال‌های 1398 تا 1400 چند نفر در دیوار آگهی گذاشتند؟"
    en: "According to Divar's annual reports, how many people posted ads on Divar in each year from 1398 to 1400?"
  answer:
    fa: "1398: 13.3 میلیون؛ 1399: 18.5 میلیون؛ 1400: 21.8 میلیون کاربر آگهی‌گذار. گزارش 1399 رقم 1398 را 13.4 میلیون آورده است."
    en: "1398: 13.3 million; 1399: 18.5 million; 1400: 21.8 million users posting ads. The 1399 report shows 13.4 million for 1398."
  comparable: true
  series_notes:
    fa: "1398 «کاربر ثبت‌شدهٔ حقیقی» را می‌شمارد (کاربری که با یک شمارهٔ تماس یکتا آگهی ثبت کرده و آگهی‌اش منتشر شده)، 1399 شماره‌های موبایلی که آگهی گذاشته‌اند (18 میلیون و 519 هزار) و 1400 کاربران یکتای آگهی‌گذار؛ هر سه یک مفهوم‌اند و گزارش 1399 خودش 1398 را با 1399 مقایسه می‌کند. بازنویسی کوچک: گزارش 1399 رقم 1398 را 13.4 میلیون نشان می‌دهد، گزارش 1398 خودش 13.3 میلیون."
    en: "1398 counts 'registered real users' (users who registered an ad with a unique phone number and had it published), 1399 the mobile numbers that posted ads (18 million 519 thousand), 1400 unique users posting ads; all three are one concept, and the 1399 report itself compares 1398 with 1399. Small restatement: the 1399 report shows 13.4 million for 1398, the 1398 report 13.3 million."
  memorisable: false
  notes: "1398's value is a detached '13/3' (p11_b4) whose 'million' sits in the next unit. 1399 writes the exact count as words plus digits (18 میلیون و 519 هزار)."
  series:
