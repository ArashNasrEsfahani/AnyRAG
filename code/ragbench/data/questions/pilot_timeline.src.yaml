- id: C-TL-karnameh-01
  corpus: C
  type: timeline
  answer_type: series
  doc_scope: [C.karnameh_annual-report_1401, C.karnameh_annual-report_1402]
  question:
    fa: "کارنامه در گزارش‌های سالانهٔ 1401 و 1402 خود گفته است چند خودرو را کارشناسی کرده، و این رقم از یک گزارش به گزارش بعد چه تغییری کرده است؟"
    en: "How many cars does Karnameh say it inspected in its 1401 and 1402 annual reports, and how did the figure change from one report to the next?"
  answer:
    fa: "1401: 250 هزار خودرو (جمع حدود سه سال فعالیت تا 1401، نه فقط یک سال)؛ 1402: 70 هزار خودرو در همان سال. رقم 1401 تجمعی و رقم 1402 سالانه است، پس این دو عدد کاهشی را نشان نمی‌دهند."
    en: "1401: 250,000 cars (cumulative over about three years of operation up to 1401, not one year); 1402: 70,000 cars inspected in that year alone. The 1401 figure is cumulative and the 1402 figure annual, so the two do not show a decline."
  comparable: false
  series_notes:
    fa: "گزارش 1401 می‌گوید کارنامه در سه سال فعالیتش (از شهریور 1398) حدود 250 هزار خودرو کارشناسی کرده است؛ این رقم تجمعی است. گزارش 1402 می‌گوید 70 هزار خودرو در سال 1402 کارشناسی شد؛ همان گزارش 69,488 خودروی کارشناسی‌شده در تهران و رشد 66 درصدی نسبت به 1401 را هم می‌دهد. پس کاهش از 250 به 70 هزار نیست."
    en: "The 1401 report says Karnameh inspected about 250 thousand cars over its three years of operation (since Shahrivar 1398): a cumulative figure. The 1402 report says 70 thousand cars were inspected in 1402; the same report also gives 69,488 cars inspected in Tehran and 66% growth over 1401. So there is no fall from 250 to 70 thousand."
  comparability_cues:
    fa: ["تجمعی", "سه سال", "جمع", "کل دوره"]
    en: ["cumulative", "three years", "since founding", "in total", "annual"]
  memorisable: false
  notes: "Only two Karnameh reports exist in the corpus. Test question T-C-karnameh-1402-02 mentions the 221 thousand transaction cars of the 1402 preface as a distractor; that unit (p3_b3) is not used here."
