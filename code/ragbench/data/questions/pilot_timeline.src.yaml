  question:
    fa: "بنا بر گزارش‌های سالانهٔ دیوار از 1397 تا 1400، دیوار در هر سال چند نفر نیروی کار داشته و این عدد چگونه عوض شده است؟"
    en: "According to Divar's annual reports from 1397 to 1400, how many people did Divar employ each year, and how did that number change?"
  answer:
    fa: "1397: 350 نفر؛ 1398: 795 نفر؛ 1399: 1029 نفر؛ 1400: 1340 نفر. این ارقام مستقیما قابل مقایسه نیستند: رقم‌های 1399 و 1400 جمع چند شرکت مجموعه است (دیوار، شرکت عملیات، کارنامه یا دیوار خودرو، و در 1399 شرکت پشتیبانی سپنتا)، در حالی که گزارش‌های 1397 و 1398 تنها یک عدد کلی بی‌تفکیک می‌دهند."
    en: "1397: 350 people; 1398: 795; 1399: 1,029; 1400: 1,340. The figures are not directly comparable: the 1399 and 1400 totals add up several group companies (Divar itself, its operations company, the car business Karnameh / Divar Khodro, and in 1399 the Sepanta support company), while the 1397 and 1398 reports give a single headline number with no breakdown."
  comparable: false
  series_notes:
    fa: "1397: «350 نفر از دانشجویان و فارغ‌التحصیلان» که در دیوار فعال‌اند؛ دامنه بیان نشده. 1398: «تعداد کل پرسنل دیوار» 795 نفر، بی‌تفکیک. 1399: عدد 1029 زیر عنوان «تعداد کارمندان دیوار» جمع چهار شرکت است: دیوار (آگه پردازان هوشمند) 274، دیوار خودرو (خودرو پردازش هوشمند) 232، عملیات دیوار (پردازش الکترونیک پیشگامان) 385 و پشتیبانی دیوار (سپنتا) 142؛ جمع این چهار 1033 است، نه 1029 (ناسازگاری درون گزارش). 1400: 1340 نفر = دیوار 420 + عملیات 624 + کارنامه 296؛ شرکت پشتیبانی جداگانه دیگر نیامده. پس رشد 350 به 1340 تغییر دامنهٔ شمارش را هم در خود دارد."
    en: "1397: '350 students and graduates' active at Divar; scope not stated. 1398: 'total Divar personnel' 795, no breakdown. 1399: the 1,029 under 'number of Divar employees' sums four companies: Divar (Agah Pardazan Hooshmand) 274, Divar Khodro (Khodro Pardazesh Hooshmand) 232, Divar operations (Pardazesh Electronic Pishgaman) 385 and Divar support (Sepanta) 142; these add to 1,033, not 1,029 (a conflict inside the report). 1400: 1,340 = Divar 420 + operations 624 + Karnameh 296; no separate support company is listed. The rise from 350 to 1,340 therefore mixes growth with a wider counting scope."
  comparability_cues:
