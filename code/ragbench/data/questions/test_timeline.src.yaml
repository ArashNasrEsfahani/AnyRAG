- id: T-C-TL-snapp-02
  corpus: C
  type: timeline
  answer_type: series
  doc_scope: [C.snapp_annual-report_1400, C.snapp_annual-report_1401, C.snapp_annual-report_1402, C.snapp_annual-report_1403]
  question:
    fa: "بنا بر گزارش‌های عملکرد اسنپ، در هر سال از 1398 تا 1403 چند سفر با سرویس خودروی اسنپ انجام شد؟"
    en: "According to Snapp's performance reports, how many rides were completed on Snapp's car service in each year from 1398 to 1403?"
  answer:
    fa: "1400: 820,089,647 سفر؛ 1401: 1,095,116,350 سفر؛ 1402: 1,376,011,494 سفر؛ 1403: 1,513,844,390 سفر. گزارش‌های 1398 و 1399 رقم سالانه نمی‌دهند؛ نمودار گزارش 1402 برای 1398 عدد 525,931,618 و برای 1399 عدد 517,094,341 را نشان می‌دهد. نمودار گزارش 1401 سفرهای 1400 را 820,100,639 آورده، اما طبق قاعده رقم خود گزارش 1400 ملاک است."
    en: "1400: 820,089,647 rides; 1401: 1,095,116,350 rides; 1402: 1,376,011,494 rides; 1403: 1,513,844,390 rides. The 1398 and 1399 reports give no annual total; the chart in the 1402 report shows 525,931,618 for 1398 and 517,094,341 for 1399. The chart in the 1401 report puts 1400 at 820,100,639, but the rule takes the 1400 report's own figure."
  comparable: true
  series_notes:
    fa: "هر رقم از گزارش همان سال است: 1400 «مجموع سفر انجام شده در 1400»، 1401 و 1402 شمار سفرهای انجام‌شده، 1403 «مجموع سفرها در سال گذشته» که واژه‌نامهٔ همان گزارش آن را همهٔ سفرهای سرویس اسنپ‌خودرو (همراه با خدمات باکسِ در دسترس در سرویس خودرو) بدون سفرهای تقلبی تعریف می‌کند؛ گزارش‌های قبلی تعریفی نمی‌دهند. بازنویسی: نمودار گزارش 1401 سفرهای 1400 را 820,100,639 نشان می‌دهد و رشد 275,015,711 سفری را هم بر همین پایه می‌دهد، در حالی که گزارش‌های 1400، 1402 و 1403 عدد 820,089,647 را دارند. گزارش‌های 1398 و 1399 رقم سالانه ندارند؛ نمودارهای گزارش‌های 1402 و 1403 برای 1398 عدد 525,931,618 و برای 1399 عدد 517,094,341 می‌گذارند (افتی اندک در سال کرونا). دام: عدد 586,198,174 که در همین نمودارها زیر 1397 آمده، در نمودار تجمعی گزارش 1401 جمع سفرها تا پایان 1397 است. گزارش 1404 رقم سالانه ندارد و فقط جمع تجمعی 7,960,133,547 سفر از 1397 تا پایان 1404 را می‌دهد."
    en: "Each figure comes from that year's report: 1400 'total rides completed in 1400', 1401 and 1402 rides completed, 1403 'total rides last year', which the 1403 glossary defines as all rides through the Snapp car service (including the box services available inside the car service), excluding fraudulent rides; earlier reports give no definition. Restatement: the chart in the 1401 report shows 820,100,639 rides for 1400 and bases its 275,015,711-ride growth figure on it, while the 1400, 1402 and 1403 reports give 820,089,647. The 1398 and 1399 reports have no annual total; the charts in the 1402 and 1403 reports give 525,931,618 for 1398 and 517,094,341 for 1399 (a small dip in the Covid year). Trap: 586,198,174, shown under 1397 in those charts, is the cumulative total to the end of 1397 in the 1401 report's cumulative chart. The 1404 report gives no annual total, only the cumulative 7,960,133,547 rides from 1397 to the end of 1404."
  memorisable: true
  notes: "Headline figures, likely reported in the press. 1402 and 1403 values also appear as detached chart numbers (p87_b5, p53_b8). Chart years were matched to values by x-coordinate."
  series:
    - period: "1400"
      value: 820089647
      unit: rides
      unit_fa: سفر
      definition:
        fa: "مجموع سفرهای انجام‌شده با اسنپ در 1400"
        en: "total rides completed on Snapp in 1400"
      doc: C.snapp_annual-report_1400
      fa: ["820,089,647"]
    - period: "1401"
      value: 1095116350
      unit: rides
      unit_fa: سفر
      definition:
        fa: "سفرهای انجام‌شده با اسنپ در 1401"
        en: "rides completed on Snapp in 1401"
      doc: C.snapp_annual-report_1401
      fa: ["1,095,116,350"]
    - period: "1402"
      value: 1376011494
      unit: rides
      unit_fa: سفر
      definition:
        fa: "تعداد سفرهای انجام‌شده با اسنپ‌خودرو در 1402"
        en: "number of rides completed on Snapp car in 1402"
      doc: C.snapp_annual-report_1402
      fa: ["1,376,011,494"]
      context:
        - {fa: ["تعداد سفرهای انجام"], only: [p88_b7]}
    - period: "1403"
      value: 1513844390
      unit: rides
      unit_fa: سفر
      definition:
        fa: "همهٔ سفرهای سرویس اسنپ‌خودرو (با خدمات باکسِ درون سرویس خودرو)، بدون سفرهای تقلبی"
        en: "all rides on the Snapp car service (box services inside the car service included), fraudulent rides excluded"
      doc: C.snapp_annual-report_1403
      fa: ["1,513,844,390"]
      context:
        - {fa: ["سفرهای تقلبی"], only: [p141_b27]}
  reconciliation:
    restatements:
      - period: "1400"
        value: 820100639
        unit: rides
        doc: C.snapp_annual-report_1401
        fa: ["820,100,639"]
        only: [p75_b6]
        note: "The 1401 report's yearly chart gives 820,100,639 rides for 1400 (its growth figure 275,015,711 = 1,095,116,350 - 820,100,639); the 1400 report gives 820,089,647. Within tolerance of the gold value."
    supplementary:
      - period: "1398"
        value: 525931618
        unit: rides
        doc: C.snapp_annual-report_1402
        fa: ["525,931,618"]
        only: [p87_b11]
        note: "The 1398 web report gives no annual ride total; the 1402 report's yearly chart gives 525,931,618 for 1398 (x-aligned with the 1398 label)."
      - period: "1399"
        value: 517094341
        unit: rides
