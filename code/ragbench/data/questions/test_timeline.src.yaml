  question:
    fa: "بر پایهٔ گزارش‌های سالانهٔ اسنپ از 1398 تا 1404، اسنپ در هر سالی که گزارش‌ها برایش رقمی می‌دهند در چند شهر خدمات می‌داد و این شمار چگونه تغییر کرد؟"
    en: "Based on Snapp's annual reports from 1398 to 1404, in how many cities was Snapp providing its service in each year for which the reports give a figure, and how did that number change?"
  answer:
    fa: "1398: 144 شهر؛ 1401: 278 شهر؛ 1402: 323 شهر؛ 1403: 424 شهر؛ 1404: 751 شهر. رقم 1404 مستقیما قابل مقایسه با سال‌های قبل نیست: از 1404 شمار شهرها بر اساس فهرست شهرهای ثبت‌شده در وزارت کشور محاسبه شده است، پس بیشتر فاصلهٔ میان 424 و 751 شهر از تغییر روش شمارش می‌آید نه از گسترش واقعی. گزارش‌های دو سال میانی رقمی برای کل اسنپ نمی‌دهند."
    en: "1398: 144 cities; 1401: 278 cities; 1402: 323 cities; 1403: 424 cities; 1404: 751 cities. The 1404 figure is not directly comparable with the earlier ones: from 1404 the cities are counted against the Interior Ministry's list of registered cities, so most of the gap between 424 and 751 cities comes from the new counting method rather than real expansion. The reports for the two years in between give no figure for Snapp as a whole."
  comparable: false
  series_notes:
    fa: "1398: گزارش وب می‌گوید اسنپ «در حال حاضر» در 144 شهر فعال است. 1401: عدد 278 شهر هم به‌عنوان شمار شهرهای محل فعالیت اسنپ آمده و هم در سخن آغازین به‌عنوان گسترهٔ سوپراپ («بیش از 60 میلیون کاربر سوپراپ در 278 شهر بزرگ و کوچک»). 1402 و 1403: «شهرهای محل فعالیت اسنپ» در فصل اسنپ‌خودرو، 323 و 424 شهر بزرگ و کوچک. 1404: 751 شهر، با این توضیح که «از 1404 تعداد شهرهای محل فعالیت بر اساس فهرست شهرهای ثبت‌شده در وزارت کشور محاسبه شده است»؛ پس جهش 424 به 751 بیشتر تغییر مبنای شمارش است. گزارش‌های 1399 و 1400 رقمی برای کل اسنپ ندارند؛ ارقام شهری گزارش 1400 به سرویس‌های دیگر مربوط‌اند (اسنپ‌فود بیش از 170 شهر، اسنپ‌تریپ 168 شهر، سوپرمارکت اسنپ 86 شهر)."
    en: "1398: the web report says Snapp is 'currently' active in 144 cities. 1401: 278 cities is given both as the number of cities where Snapp operates and, in the preface, as the superapp's footprint ('more than 60 million superapp users in 278 large and small cities'). 1402 and 1403: 'cities where Snapp operates', 323 and 424 large and small cities, in the Snapp car chapter. 1404: 751 cities, with the note that 'from 1404 the number of cities of operation is calculated from the list of cities registered with the Interior Ministry'; the jump from 424 to 751 is therefore mostly a change in the counting basis. The 1399 and 1400 reports give no figure for Snapp as a whole; the city counts in the 1400 report belong to other services (SnappFood more than 170 cities, SnappTrip 168, the Snapp supermarket service 86)."
  comparability_cues:
    fa: ["وزارت کشور", "روش شمارش", "فهرست شهرهای ثبت", "مبنای شمارش", "شیوه محاسبه"]
    en: ["Interior Ministry", "counting method", "registered cities", "counting basis", "method changed"]
  memorisable: false
  notes: "1402's 323 is a detached number (p89_b4) whose label is p89_b3; 1404's method note is p43_b9. The 1400 report's service-level city counts are distractors."
  series:
