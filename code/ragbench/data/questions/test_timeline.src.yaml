        note: "No 1402 report in the corpus; the 1403 report's user chart gives 1,947,279 for 1402 (the 1404 report repeats it)."

- id: T-C-TL-khanoumi-02
  corpus: C
  type: timeline
  answer_type: series
  doc_scope: [C.khanoumi_annual-report_1403, C.khanoumi_annual-report_1404]
  question:
    fa: "بنا بر گزارش‌های سالانهٔ خانومی، در هر یک از سال‌های 1402 تا 1404 چند درصد از سفارش‌های این فروشگاه به مشتریان تهرانی فرستاده شد؟"
    en: "According to Khanoumi's annual reports, what percentage of the shop's orders went to customers in Tehran in each year from 1402 to 1404?"
  answer:
    fa: "1402: 44.05 درصد؛ 1403: 39.7 درصد؛ 1404: 38 درصد. گزارش 1402 در مجموعه نیست و رقم آن از گزارش 1403 می‌آید. گزارش 1404 سهم 1403 را 40 درصد آورده، اما رقم خود گزارش 1403 یعنی 39.7 درصد ملاک است."
    en: "1402: 44.05%; 1403: 39.7%; 1404: 38%. There is no 1402 report in the corpus; that figure comes from the 1403 report. The 1404 report puts 1403 at 40%, but the 1403 report's own figure, 39.7%, is the gold value."
  comparable: true
  series_notes:
    fa: "سهم تهران از سفارش‌ها، مکمل «سهم سایر استان‌ها». گزارش 1403: دو نمودار دایره‌ای، 1403 با تهران %39.7 و سایر استان‌ها %60.3، و 1402 با %44.05 و %55.95؛ متن می‌گوید سهم استان‌های غیر از پایتخت نسبت به 1402، 4.3 واحد درصد بیشتر شده است. گزارش 1404: دو نمودار، 1404 با تهران %38 و سایر استان‌ها %62 («از هر هزار سفارش بیش از 600 سفارش راهی استان‌های غیر از تهران شد») و 1403 با تهران %40 و سایر استان‌ها %60. بازنویسی: گزارش 1404 سهم 1403 را گرد‌شده 40 درصد می‌دهد، گزارش 1403 خودش 39.7 درصد. جای ارقام روی دو نمودار با مختصات برچسب سال‌ها تعیین شد. 1402 گزارش مستقلی در مجموعه ندارد (تکمیلی)."
    en: "Tehran's share of orders, the complement of 'share of other provinces'. 1403 report: two donut charts, 1403 with Tehran 39.7% and other provinces 60.3%, and 1402 with 44.05% and 55.95%; the text says the share of provinces other than the capital rose 4.3 percentage points over 1402. 1404 report: two charts, 1404 with Tehran 38% and other provinces 62% ('of every thousand orders more than 600 went to provinces other than Tehran') and 1403 with Tehran 40% and other provinces 60%. Restatement: the 1404 report gives 1403 as a rounded 40%, the 1403 report itself 39.7%. Which donut belongs to which year was settled by the coordinates of the year labels. 1402 has no report of its own in the corpus (supplementary)."
  memorisable: false
  notes: "Stat groups: 1403 report p42_g1 (%39.7, next to label '1403' p42_b19) and p42_g2 (%44.05, next to '1402' p42_b20); 1404 report p28_g3 (%38, next to '1404' p28_b30) and p28_g5 (%40, next to '1403' p28_b31)."
  series:
