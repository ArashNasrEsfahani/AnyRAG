- id: T-C-TL-snapp-06
  corpus: C
  type: timeline
  answer_type: series
  doc_scope: [C.snapp_annual-report_1401, C.snapp_annual-report_1402, C.snapp_annual-report_1403, C.snapp_annual-report_1404]
  question:
    fa: "بنا بر گزارش‌های سالانهٔ اسنپ از 1401 تا 1404، اسنپ‌دکتر در هر سال چند کاربر داشت و این رقم چگونه تغییر کرد؟"
    en: "According to Snapp's annual reports from 1401 to 1404, how many users did Snapp Doctor have in each year, and how did the figure change?"
  answer:
    fa: "1401: 10,000,000 کاربر فعال؛ 1402: 15,022,400 کاربر؛ 1403: 17,635,017 حساب کاربری؛ 1404: 19,832,369 حساب کاربری. این ارقام قابل مقایسه نیستند: رقم 1401 «کاربر فعال» خوانده شده، اما از 1402 گزارش‌ها کل حساب‌های ثبت‌شده از آغاز فعالیت را می‌دهند و کاربران فعال را بسیار کمتر گزارش می‌کنند؛ پس فاصلهٔ 10 تا 15 میلیون را نمی‌توان روند دانست."
    en: "1401: 10,000,000 active users; 1402: 15,022,400 users; 1403: 17,635,017 user accounts; 1404: 19,832,369 user accounts. The figures are not comparable: the 1401 figure is labelled 'active users', but from 1402 the reports give all accounts registered since launch and report far fewer active users, so the move from 10 to 15 million cannot be read as a trend."
  comparable: false
  series_notes:
    fa: "1401: «تعداد کاربران اسنپ دکتر در سال 1401: 10,000,000 کاربر فعال»، و در متن «بیش از 10میلیون کاربر فعال در سال گذشته»؛ خط زمانی هم «اسفند: 10میلیونی شدن کاربران فعال» را دارد. 1402: «تعداد کل کاربران اسنپ‌دکتر» 15,022,400 (کاربران ثبت‌نامی از آغاز)، ولی «تعداد کاربران فعال اسنپ‌دکتر در 1402» فقط 1,211,170. 1403: کل کاربران 17,635,017 حساب کاربری و بیش از 500,000 حساب فعال در مشاورهٔ آنلاین. 1404: کل کاربران 19,832,369 حساب کاربری و 1,058,721 حساب فعال در مشاورهٔ آنلاین. رقم 1401 با برچسب «فعال» از نظر اندازه به کل حساب‌ها نزدیک است نه به کاربران فعال سال‌های بعد؛ برچسب‌ها ناهمسان‌اند. گزارش‌های 1399 و 1400 شمار کل کاربران اسنپ‌دکتر را نمی‌دهند (1400 فقط 189 هزار کاربر خدمات کرونا را دارد)."
    en: "1401: 'number of Snapp Doctor users in 1401: 10,000,000 active users', and in the text 'more than 10 million active users last year'; the timeline also has 'Esfand: active users reach 10 million'. 1402: 'total Snapp Doctor users' 15,022,400 (users registered since launch), but 'active Snapp Doctor users in 1402' only 1,211,170. 1403: total users 17,635,017 accounts and more than 500,000 accounts active in online consultation. 1404: total users 19,832,369 accounts and 1,058,721 accounts active in online consultation. The 1401 figure labelled 'active' is close in size to the total accounts, not to the later active counts; the labels do not match. The 1399 and 1400 reports give no total Snapp Doctor user count (1400 only has 189 thousand users of Covid services)."
  comparability_cues:
    fa: ["کاربر فعال", "کل حساب", "کل کاربران", "از آغاز فعالیت", "برچسب", "حساب کاربری"]
    en: ["active users", "total accounts", "total users", "since launch", "labelled", "user accounts"]
  memorisable: false
  notes: "1404's total (p130_g1) sits in a section titled after a delivery record; p131_b10 ('most popular Snapp Doctor service') ties it to Snapp Doctor. The extraction writes 'دتر' for 'دکتر' in some 1401 units."
