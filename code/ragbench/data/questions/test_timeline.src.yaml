# TEST timeline questions: the human-written source of test_timeline.jsonl (file name starts with "test", so
# ragbench.run stamps split=test and refuses to run it without --final).
#
# Build (links quotes to unit ids, writes test_timeline.jsonl), then validate:
#   .venv/Scripts/python.exe -m ragbench.tools.questions build --src ragbench/data/questions/test_timeline.src.yaml --out ragbench/data/questions/test_timeline.jsonl
#   .venv/Scripts/python.exe -m ragbench.tools.questions validate --path ragbench/data/questions/test_timeline.jsonl --strict
#
# Schema: ragbench/eval/timeline.py. YAML keys: ragbench/tools/timeline_questions.py. Format follows pilot_timeline.src.yaml.
# Every value was copied from corpus C unit text (ragbench.corpus.registry.load_set("C")), not from a model. Values
# of detached chart numbers were tied to their year labels by the block coordinates in corpus/extracted/*/document.json.
#
# Reconciliation rule: the report OF a period gives the gold value. A later report's different number for that
# period is a restatement (not gold); a period without its own report in the corpus is supplementary (optional).
#
# Series: Snapp 1398-1404 (6 questions), Nobitex 2021/2022/2024-2025 (2), Khanoumi 1403/1404 (2). No dev series
# (Divar, Cafe Bazaar, Tipax, Tapsell, Karnameh). No unit below is gold in test*.jsonl or pilot*.jsonl (checked after
# build). Deliberately left out: any Snapp driver series (registered/active/women drivers) and SnappBox/SnappFood
# driver or courier counts, because the agentic method was tuned live on the Snapp drivers question (kept as a DEV
# example); Snapp employees (dev question C-snapp-03 uses the 1398 and 1402 figures).
# Number formats to know: Nobitex charts use dots as thousands separators (4.318.701), which the parser reads as
# 4.318, so those values are written in million users at 3 decimals.
# Series measured in hours (Snapp rider hours, Khanoumi support talk hours) were dropped: the text scorer
# (eval/timeline.py classify_mentions) discards any number followed by a duration word, so no text answer
# could score on them.

questions:

