- id: T-C-TL-nobitex-02
  corpus: C
  type: timeline
  answer_type: series
  doc_scope: [C.nobitex_annual-report_2021, C.nobitex_annual-report_2022, C.nobitex_biennial-report_2024-2025]
  question:
    fa: "بر اساس گزارش‌های نوبیتکس، در هر سال از 2021 تا 2025 چه سهمی از کاربران این صرافی را زنان تشکیل می‌دادند؟"
    en: "Based on Nobitex's reports, what share of the exchange's users were women in each year from 2021 to 2025?"
  answer:
    fa: "2021: 16 درصد؛ 2022: 22 درصد؛ 2024: 30 درصد؛ 2025: 32 درصد. برای 2023 گزارش دوسالانه 23 درصد را نشان می‌دهد. همان نمودار دوسالانه سهم 2021 را 20 درصد نشان می‌دهد، اما طبق قاعده رقم خود گزارش 2021 یعنی 16 درصد ملاک است."
    en: "2021: 16%; 2022: 22%; 2024: 30%; 2025: 32%. For 2023 the biennial report shows 23%. The same biennial chart shows 20% for 2021, but the rule takes the 2021 report's own figure, 16%."
  comparable: true
  series_notes:
    fa: "2021: «16% خانم» در نمودار ترکیب جنسیتی و «خانم‌ها 16 درصد کل کاربران را تشکیل داده‌اند». 2022: «22درصد کاربران خانم هستند» و نمودار %21.89؛ گزارش 2022 سهم 2021 را همان 16 درصد می‌داند. گزارش دوسالانه: متن «اکنون %32 از کاربران نوبیتکس را زنان تشکیل می‌دهند» و نموداری سالانه که ستون‌هایش، بر پایهٔ جای برچسب‌ها روی صفحه، 2019: 8، 2020: 16، 2021: 20، 2022: 22، 2023: 23، 2024: 30 و 2025: 32 درصد است. بازنویسی: این نمودار 2021 را 20 درصد نشان می‌دهد، در حالی که گزارش خود 2021 شانزده درصد گفته است؛ عدد 16 در این نمودار روی 2020 نشسته است. 2023 گزارش مستقلی ندارد (تکمیلی: 23 درصد)."
    en: "2021: '16% women' in the gender-mix chart and 'women make up 16 percent of all users'. 2022: '22 percent of users are women' and the chart's 21.89%; the 2022 report also puts 2021 at 16%. Biennial report: the text 'now 32% of Nobitex users are women' and a yearly chart whose bars, placed by their labels' positions on the page, read 2019: 8, 2020: 16, 2021: 20, 2022: 22, 2023: 23, 2024: 30 and 2025: 32 percent. Restatement: this chart shows 20% for 2021, whereas the 2021 report itself said 16%; the 16 in this chart sits on 2020. 2023 has no report of its own (supplementary: 23%)."
  memorisable: false
  notes: "The biennial chart values (p8_b5..b11) were matched to the year labels (p8_b20..b26) by x-coordinate in corpus/extracted/nobitex/nobitex_biennial-report_2024-2025_fa/document.json (e.g. '20 %' x=915 over '2021' x=917)."
