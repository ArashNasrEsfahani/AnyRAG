      value: 2743999
      unit: users
      unit_fa: نفر
      definition:
        fa: "کاربران یکتای خانومی در 1403"
        en: "Khanoumi unique users in 1403"
      doc: C.khanoumi_annual-report_1403
      fa: ["2,743,999"]
      context:
        - {fa: ["تعداد کاربران"], only: [p39_b5]}
        - {fa: ["کاربران یکتا"], only: [p17_g3]}
    - period: "1404"
      value: 3200995
      unit: users
      unit_fa: نفر
      definition:
        fa: "کاربران یکتای خانومی در 1404"
        en: "Khanoumi unique users in 1404"
      doc: C.khanoumi_annual-report_1404
      fa: ["3,200,995"]
      context:
        - {fa: ["1404"], only: [p23_b7]}
        - {fa: ["کاربران یکتا"], only: [p9_g6]}
  reconciliation:
