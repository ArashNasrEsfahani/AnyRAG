- id: T-C-TL-khanoumi-01
  corpus: C
  type: timeline
  answer_type: series
  doc_scope: [C.khanoumi_annual-report_1403, C.khanoumi_annual-report_1404]
  question:
    fa: "خانومی در گزارش‌های سالانه‌اش شمار کاربران یکتای خود را برای هر یک از سال‌های 1402 تا 1404 چند اعلام کرده است؟"
    en: "What number of unique users does Khanoumi give for each of the years 1402 to 1404 in its annual reports?"
  answer:
    fa: "1402: 1,947,279 نفر؛ 1403: 2,743,999 نفر؛ 1404: 3,200,995 نفر. گزارش 1402 در مجموعه نیست و رقم آن سال از گزارش‌های 1403 و 1404 می‌آید."
    en: "1402: 1,947,279 people; 1403: 2,743,999 people; 1404: 3,200,995 people. There is no 1402 report in the corpus; that year's figure comes from the 1403 and 1404 reports."
  comparable: true
  series_notes:
    fa: "«تعداد کاربران» در گزارش 1403 (1402: 1,947,279 و 1403: 2,743,999، رشد 41 درصد) و «کاربران یکتا» در خلاصهٔ هر دو گزارش (+2,700,000 در 1403 و +3200000 در 1404) یک سنجه‌اند. گزارش 1404 همان 1,947,279 و 2,743,999 را برای 1402 و 1403 تکرار می‌کند و 3,200,995 را برای 1404 می‌دهد (حدود نیم میلیون نفر بیشتر). یادداشت مدیرعامل در گزارش 1403 می‌گوید «بیش از 2.7 میلیون زن» دست‌کم یک بار با خانومی تعامل داشته‌اند، در حالی که 8.7 درصد کاربران 1403 مرد بوده‌اند؛ این جمله دقیقا همان شمار کاربران یکتا نیست. 1402 گزارش مستقلی در مجموعه ندارد (تکمیلی)."
    en: "'Number of users' in the 1403 report (1402: 1,947,279 and 1403: 2,743,999, 41% growth) and 'unique users' in both reports' summaries (+2,700,000 in 1403, +3200000 in 1404) are one measure. The 1404 report repeats 1,947,279 and 2,743,999 for 1402 and 1403 and gives 3,200,995 for 1404 (about half a million more). The CEO's note in the 1403 report says 'more than 2.7 million women' interacted with Khanoumi at least once, while 8.7% of 1403 users were men, so that sentence is not exactly the unique-user count. 1402 has no report of its own in the corpus (supplementary)."
  memorisable: false
  notes: "1404's 3,200,995 is a detached chart number (p23_b8) whose year label is p23_b7; the summary unit p9_g6 gives the rounded '+3200000' and serves as the label for 'unique users'."
  series:
