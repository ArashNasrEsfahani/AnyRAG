- id: T-C-TL-snapp-04
  corpus: C
  type: timeline
  answer_type: series
  doc_scope: [C.snapp_annual-report_1398, C.snapp_annual-report_1400, C.snapp_annual-report_1401, C.snapp_annual-report_1402, C.snapp_annual-report_1403, C.snapp_annual-report_1404]
  question:
    fa: "بنا بر گزارش‌های سالانهٔ اسنپ از 1398 تا 1404، اسنپ‌فود (سرویس سفارش غذای اسنپ) در هر سال چند کاربر داشت و این شمار چه تغییری کرد؟"
    en: "According to Snapp's annual reports from 1398 to 1404, how many users did SnappFood (Snapp's food-ordering service) have in each year, and how did that number change?"
  answer:
    fa: "1398: 5,737,520 کاربر؛ 1400: عبور از 5 میلیون کاربر؛ 1401: 5,000,000 کاربر؛ 1402: 20,480,211 کاربر؛ 1403: 26,804,977 حساب کاربری؛ 1404: 37,703,281 حساب کاربری. این ارقام قابل مقایسه نیستند: از 1402 گزارش‌ها کل کاربران یعنی همهٔ حساب‌های ثبت‌شده از آغاز فعالیت را می‌شمارند، در حالی که ارقام 1398 تا 1401 کاربران سرویس را بی‌تعریف روشن و در مقیاس چند میلیون می‌دهند؛ پس فاصلهٔ 5 تا 20 میلیون تغییر تعریف است نه رشد."
    en: "1398: 5,737,520 users; 1400: passed 5 million users; 1401: 5,000,000 users; 1402: 20,480,211 users; 1403: 26,804,977 user accounts; 1404: 37,703,281 user accounts. The figures are not comparable: from 1402 the reports count total users, i.e. every account registered since launch, whereas the 1398 to 1401 figures give the service's users without a clear definition and on a scale of a few million; the gap from 5 to 20 million is a change of definition, not growth."
  comparable: false
  series_notes:
    fa: "1398: «تعداد کاربران این سرویس [سفارش غذا] با 113درصد رشد در سال 98 به 5میلیون و 737هزار و 520 نفر رسیده است»، بی‌تعریف. 1400: در خط زمانی رویدادهای اسنپ‌فود، «عبور از 5 میلیون کاربر». 1401: «تعداد کاربران اسنپ فود 5,000,000 کاربر». 1402: «تعداد کل کاربران اسنپ‌فود» 20,480,211 که واژه‌نامه آن را کاربران ثبت‌نامی از ابتدای فعالیت تا پایان 1402 می‌داند؛ کاربران فعال (دست‌کم یک سفارش در سال) 7,445,702. 1403 و 1404: «تعداد کل کاربران مشتری» 26,804,977 و 37,703,281 حساب کاربری، با این قید که هر حساب برابر یک نفر نیست؛ کاربران فعال 9,396,568 و 9,216,098. پس ارقام تا 1401 به مقیاس کاربران فعال نزدیک‌ترند و از 1402 موجودی تجمعی حساب‌ها آمده است. مقدمهٔ فصل‌ها هم «بیش از 20,000,000»، «حدود 27,000,000» و «بیش از 37,000,000» کاربر می‌گوید. گزارش 1399 شمار کاربران اسنپ‌فود را ندارد."
    en: "1398: 'the number of users of this [food-ordering] service grew 113% in 98 to 5 million 737 thousand 520', undefined. 1400: the SnappFood timeline lists 'passing 5 million users'. 1401: 'number of SnappFood users 5,000,000'. 1402: 'total SnappFood users' 20,480,211, which the glossary defines as users registered from launch to the end of 1402; active users (at least one order in the year) 7,445,702. 1403 and 1404: 'total customer users' 26,804,977 and 37,703,281 user accounts, with the caveat that an account is not a person; active users 9,396,568 and 9,216,098. The figures up to 1401 are thus closer in scale to active users, and from 1402 the reports give the cumulative stock of accounts. The chapter introductions also say 'more than 20,000,000', 'about 27,000,000' and 'more than 37,000,000' users. The 1399 report gives no SnappFood user count."
