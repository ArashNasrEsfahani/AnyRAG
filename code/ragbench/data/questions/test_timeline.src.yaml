- id: T-C-TL-nobitex-01
  corpus: C
  type: timeline
  answer_type: series
  doc_scope: [C.nobitex_annual-report_2021, C.nobitex_annual-report_2022, C.nobitex_biennial-report_2024-2025]
  question:
    fa: "نوبیتکس بنا بر گزارش‌هایش در پایان هر سال میلادی از 2021 تا 2025 چند کاربر داشت؟"
    en: "According to its reports, how many users did Nobitex have at the end of each calendar year from 2021 to 2025?"
  answer:
    fa: "2021: 3,231,333 کاربر؛ 2022: 4,318,701 کاربر؛ 2024: 10,628,087 کاربر؛ 2025: 11,490,676 کاربر. برای 2023 گزارشی در مجموعه نیست؛ گزارش دوسالانه برای آن 5,761,427 کاربر می‌دهد. نمودار گزارش 2022 کاربران پایان 2021 را 3,231,330 نشان می‌دهد، اما رقم خود گزارش 2021 ملاک است."
    en: "2021: 3,231,333 users; 2022: 4,318,701 users; 2024: 10,628,087 users; 2025: 11,490,676 users. There is no 2023 report in the corpus; the biennial report gives 5,761,427 users for that year. The chart in the 2022 report shows 3,231,330 users at the end of 2021, but the 2021 report's own figure is the gold value."
  comparable: true
  series_notes:
    fa: "ارقام کاربران ثبت‌نامی در پایان هر سال میلادی‌اند. 2021: متن و نمودار گزارش 2021 «سه میلیون و 231 هزار» و 3,231,333 در پایان 2021 را می‌دهند؛ بخش «نوبیتکس در یک نگاه» همان گزارش «+3,500,000 کاربر» دارد که احتمالا به زمان انتشار برمی‌گردد. 2022: نمودار «تعداد کاربران نوبیتکس در پایان هر سال میلادی» 4.318.701 (با نقطه به‌جای جداکنندهٔ هزارگان) و متن «چهار میلیون و 318هزار نفر». بازنویسی کوچک: همان نمودار 2021 را 3.231.330 نشان می‌دهد (گزارش 2021: 3,231,333) و 2020 را 390.036 (گزارش 2021: 390,039). گزارش دوسالانه گزارش خود 2024 و 2025 است: 10.628.087 در 2024 و 11.490.676 در 2025 (در متن «11 میلیون و 500 هزار»، رشد 99.5 درصدی از 2023). برای 2023 گزارشی در مجموعه نیست؛ نمودار دوسالانه 5.761.427 را می‌دهد (تکمیلی)."
