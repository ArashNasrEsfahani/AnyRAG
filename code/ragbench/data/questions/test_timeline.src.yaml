- id: T-C-TL-snapp-05
  corpus: C
  type: timeline
  answer_type: series
  doc_scope: [C.snapp_annual-report_1399, C.snapp_annual-report_1400, C.snapp_annual-report_1401, C.snapp_annual-report_1402, C.snapp_annual-report_1403, C.snapp_annual-report_1404]
  question:
    fa: "اسنپ در هر سال از 1399 تا 1404 با نگرفتن کمیسیون از گروه‌های خاصی از رانندگان (مثل رانندگان دارای معلولیت) روی هم از چه مبلغی چشم پوشید و این مبلغ چه تغییری کرد؟"
    en: "In each year from 1399 to 1404, how much money in total did Snapp forgo by not charging commission to certain groups of drivers (such as drivers with disabilities), and how did the amount change?"
  answer:
    fa: "1399: حدود 20 میلیارد تومان؛ 1400: 35 میلیارد تومان؛ 1401: بیش از 62 میلیارد تومان؛ 1402: 115,128,206,700 تومان؛ 1403: 182,938,426,946 تومان؛ 1404: 150,674,680,112 تومان. مبلغ تا 1403 هر سال بالا رفت و در 1404 کم شد."
    en: "1399: about 20 billion tomans; 1400: 35 billion tomans; 1401: more than 62 billion tomans; 1402: 115,128,206,700 tomans; 1403: 182,938,426,946 tomans; 1404: 150,674,680,112 tomans. The amount rose every year up to 1403 and fell in 1404."
  comparable: true
  series_notes:
    fa: "همهٔ ارقام ارزش کمیسیونی است که اسنپ از رانندگان مشمول نگرفته (تومان، اسمی). گروه‌های مشمول سال به سال کمی عوض شده‌اند: 1399 رانندگان دارای معلولیت، جانبازان، ایثارگران، خانوادهٔ شهدا، زنان سرپرست خانواده و مبتلایان به هموفیلی؛ 1400 افراد دارای معلولیت، جانبازان، خانواده‌های شهدا و بیماران خاص؛ 1402 همین گروه‌ها به‌علاوهٔ مبتلایان ام‌اس و تالاسمی و معافیت کوتاه‌مدت در بحران کرمان؛ 1403 افراد دارای معلولیت، تالاسمی و زنان سرپرست خانوار؛ 1404 افراد دارای معلولیت و خانواده‌های اهداکنندگان عضو. سنجه یکی است، اما ارقام اسمی‌اند و تورم را در خود دارند. رقم 1399 تقریبی («حدود 20میلیارد») و 1401 کران پایین («62,000,000,000 +») است. نمودارهای گزارش‌های 1402 تا 1404 همان ارقام را گرد‌شده تکرار می‌کنند (+35، +62، +115، +182 و +150 میلیارد تومان)، پس بازنویسی‌ای در کار نیست."
    en: "All figures are the value of commission Snapp did not collect from eligible drivers (tomans, nominal). The eligible groups shift slightly from year to year: 1399 drivers with disabilities, war veterans, isargaran, martyrs' families, women heads of household and people with haemophilia; 1400 people with disabilities, veterans, martyrs' families and patients with special conditions; 1402 the same plus MS and thalassaemia patients and a short exemption after the Kerman attack; 1403 people with disabilities, thalassaemia patients and women heads of household; 1404 people with disabilities and families of organ donors. The measure is the same, but the figures are nominal and carry inflation. The 1399 figure is approximate ('about 20 billion') and 1401 is a lower bound ('62,000,000,000 +'). The charts in the 1402 to 1404 reports repeat the same figures rounded (+35, +62, +115, +182 and +150 billion tomans), so there is no restatement."
  memorisable: false
  notes: "1400's 35,000,000,000 is a detached number (p17_b9) labelled by p17_b12. The question is about money forgone, not about driver counts."
  series:
    - period: "1399"
      value: 20000000000
